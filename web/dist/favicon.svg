<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="128" height="128" rx="28" fill="#090B10" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Circular Vinyl Grooves -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#solanaGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 6" />
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#solanaGrad)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="8 4" />
  <circle cx="64" cy="64" r="30" fill="none" stroke="url(#solanaGrad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Central Stylized X Logo -->
  <g filter="url(#neonGlow)">
    <!-- Main Cross Bars -->
    <path d="M34 34 L54 64 L34 94 L46 94 L64 67 L82 94 L94 94 L74 64 L94 34 L82 34 L64 61 L46 34 Z" fill="url(#solanaGrad)" />
    <!-- Inner Accent Core -->
    <path d="M40 38 L58 64 L40 90 M88 38 L70 64 L88 90" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />
  </g>
</svg>
