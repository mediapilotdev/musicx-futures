<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#01B8CA" />
      <stop offset="100%" stop-color="#0C78E8" />
    </linearGradient>
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Celestial Navy Background -->
  <rect width="128" height="128" rx="28" fill="#0D1B2A" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(1,184,202,0.25)" stroke-width="1.5" />

  <!-- Dreamstarter-Style Outer Turquoise Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#01B8CA" stroke-width="7" stroke-opacity="0.95" />
  
  <!-- Sonic Waveform Grid / Grooves -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#00F5D4" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Central Dynamic MusicX Symbol -->
  <g filter="url(#dsGlow)">
    <path d="M42 40 L58 64 L42 88 L52 88 L64 70 L76 88 L86 88 L70 64 L86 40 L76 40 L64 58 L52 40 Z" fill="url(#tealGrad)" />
    <!-- Center Sonic Wave Accent -->
    <line x1="32" y1="64" x2="42" y2="64" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="86" y1="64" x2="96" y2="64" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
